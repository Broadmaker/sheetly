name = "sheetly"
compatibility_date = "2026-11-03"
pages_build_output_dir = "./dist"

# Login credentials (single user). Set as encrypted secrets:
#   wrangler pages secret put BASIC_AUTH_USER
#   wrangler pages secret put BASIC_AUTH_PASSWORD
# Optional: set SESSION_SECRET to sign session cookies (defaults to BASIC_AUTH_PASSWORD).
# For local development, put these in .dev.vars (gitignored):
#   BASIC_AUTH_USER=your-username
#   BASIC_AUTH_PASSWORD=your-password
#   SESSION_SECRET=your-random-secret

[[d1_databases]]
binding = "DB"
database_name = "sheetly-db"
database_id = "508ac493-5607-4cd3-9f82-f7199d0c9bd8"

# Create the bucket with:
#   wrangler r2 bucket create sheetly-uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "sheetly-uploads"
